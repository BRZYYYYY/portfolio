<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Activity 10 | External JavaScript</title>
    <script src="script.js"></script>
    <meta name="viewport" content="device-width, initial-scale 1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: aqua;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }

        button {
            background-color: blue;
            border-radius: 8px;
            padding: 10px 20px;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: red;
        }

        input[type="text"] {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid black;
        }

        label {
            margin-right: 10px;
        }

        p {
            font-size: 16px;
            margin-top: 10px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Arithmetic Operators</h1>
        <form id="sumForm">
            <label for="num1">Number 1:</label>
            <input type="text" id="num1" name="num1"><br><br>
            <label for="num2">Number 2:</label>
            <input type="text" id="num2" name="num2"><br><br>
            <button type="button" onclick="calculate()">Calculate</button>
            <button type="reset" onclick="clearFields()">Clear</button>
        </form>

        <p id="sum"></p>
        <p id="difference"></p>
        <p id="product"></p>
        <p id="quotient"></p>
        <p id="modulo"></p>
    </div>
</body>
</html>
