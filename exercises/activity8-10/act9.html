<!DOCTYPE html>
<html>
    <head>
        <title>Activity 9 | JS Prompt</title>
        <script>
            function myFunction(){
                let txt;
                let fullName = prompt("fullName :");
                if(fullName == null || fullName == ""){
                    txt = "The field is required!";
                }else{
                    txt= "Hello, " + fullName + "! How are you today?";
                }
                document.getElementById("demo").innerHTML = txt;
            }
        </script>
    </head>

    <body>
        <h2>JavaScript Prompt</h2>
        <button onclick="myFunction()">Click here po!</button>
        <p id="demo"></p>
    </body>


</html>
